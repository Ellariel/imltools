[project]
name = "imltools"
version = "0.1.0"
description = "Interpretable machine learning toolbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.5.0",
    "matplotlib>=3.11.2",
    "more-itertools>=10.2.0",
    "numpy>=1.26.4",
    "numpy>=2.1; python_version >= '3.13'",
    "pandas>=3.0.6",
    "scikit-learn>=1.5.2",
    "scipy>=1.12.0",
    "scipy>=1.14.1; python_version >= '3.13'",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "shap>=0.47; python_version >= '3.13'",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncvgbdt"]

[tool.hatch.build.targets.sdist]
include = ["src", "example.py", "tests", "README.md", "LICENSE"]
